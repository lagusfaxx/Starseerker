# ---------------------------------------------------------------------------
# STARSEEKER Chile en Coolify
#
# Uso: en Coolify crea un recurso "Docker Compose" apuntando a este repositorio.
# El dominio se asigna en Coolify → Domains (servicio `app`, puerto 3000), y
# SERVICE_PASSWORD_POSTGRES la genera Coolify la primera vez.
#
# Las variables sin valor por defecto se completan en Coolify →
# Environment Variables (ver .env.example y el README).
#
# `environment` usa sintaxis de mapa a propósito: la de lista rompe el parser
# de Coolify ("non-string key in services.app.environment").
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # El dominio también se hornea en el build para las URLs canónicas.
        APP_URL: "${APP_URL:-https://starseerker.cl}"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      APP_URL: "${APP_URL:-https://starseerker.cl}"
      DATABASE_URL: "postgresql://starseerker:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/starseerker?schema=public"
      AUTH_SECRET: "${AUTH_SECRET}"
      MP_ACCESS_TOKEN: "${MP_ACCESS_TOKEN:-}"
      MP_WEBHOOK_SECRET: "${MP_WEBHOOK_SECRET:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM: "${RESEND_FROM:-STARSEEKER Chile <hola@starseerker.cl>}"
      ORDER_NOTIFICATION_EMAIL: "${ORDER_NOTIFICATION_EMAIL:-ventas@starseerker.cl}"
      # Usuario inicial del panel: se crea solo en el primer arranque.
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@starseerker.cl}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
      # auto = sembrar solo la primera vez. true fuerza, false desactiva.
      RUN_SEED: "${RUN_SEED:-auto}"
      # El seed no crea productos; true agrega el catálogo oficial como borrador.
      SEED_CATALOG: "${SEED_CATALOG:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: starseerker
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES}"
      POSTGRES_DB: starseerker
    volumes:
      - starseerker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starseerker -d starseerker"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  starseerker-postgres:
